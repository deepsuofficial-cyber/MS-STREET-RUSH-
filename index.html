<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>MACRAS STREET RUSH</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020409;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

body{
  touch-action:none;
}

button{
  font:inherit;
  border:0;
  outline:0;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#020409;
}

/* ================= SPLASH ================= */

#loading{
  position:absolute;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 45%,#102541 0%,#050b16 40%,#010204 80%);
}

.loaderLogo{
  width:110px;
  height:110px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:52px;
  font-weight:1000;
  background:
    radial-gradient(circle at 35% 25%,#ff5b78,#e0003b 45%,#33000e);
  border:4px solid #ff1744;
  box-shadow:
    0 0 20px #ff1744,
    0 0 70px rgba(255,23,68,.45),
    inset 0 5px 15px rgba(255,255,255,.2);
}

.loaderBrand{
  margin-top:24px;
  font-size:22px;
  letter-spacing:8px;
  font-weight:1000;
}

.loaderGame{
  margin-top:7px;
  font-size:18px;
  color:#178cff;
  letter-spacing:5px;
  font-weight:900;
}

.loaderTrack{
  width:270px;
  height:7px;
  margin-top:30px;
  border-radius:20px;
  overflow:hidden;
  background:#172438;
}

.loaderFill{
  height:100%;
  width:0%;
  border-radius:20px;
  background:linear-gradient(90deg,#ff1744,#9d39ff,#008cff);
  transition:width .2s;
}

.loaderStatus{
  margin-top:13px;
  color:#7d91aa;
  font-size:13px;
}

/* ================= MENU ================= */

#menu{
  position:absolute;
  inset:0;
  display:none;
  overflow-y:auto;
  padding:
    calc(18px + env(safe-area-inset-top))
    15px
    calc(25px + env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 0%,rgba(0,136,255,.20),transparent 35%),
    radial-gradient(circle at 100% 60%,rgba(255,23,68,.14),transparent 35%),
    #03060c;
  z-index:100;
}

.logoArea{
  text-align:center;
  padding-top:8px;
}

.logo{
  width:82px;
  height:82px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:50%;
  font-size:42px;
  font-weight:1000;
  background:
    radial-gradient(circle at 35% 25%,#ff6580,#d90039 45%,#21000a);
  border:3px solid #ff1744;
  box-shadow:
    0 0 30px rgba(255,23,68,.65),
    inset 0 4px 12px rgba(255,255,255,.2);
}

.brand{
  margin-top:10px;
  color:#168cff;
  letter-spacing:7px;
  font-size:16px;
  font-weight:1000;
}

.gameTitle{
  margin-top:4px;
  font-size:33px;
  font-weight:1000;
}

.gameTitle span{
  color:#ff1744;
}

/* CHARACTER CARD */

.characterCard{
  position:relative;
  height:235px;
  margin-top:15px;
  overflow:hidden;
  border-radius:27px;
  border:1px solid rgba(0,136,255,.5);
  background:
    radial-gradient(circle at 50% 35%,rgba(0,136,255,.23),transparent 42%),
    linear-gradient(145deg,#101d30,#03060b);
  box-shadow:
    inset 0 1px rgba(255,255,255,.12),
    0 15px 35px rgba(0,0,0,.5);
}

.characterCard:after{
  content:"";
  position:absolute;
  left:20%;
  right:20%;
  bottom:12px;
  height:25px;
  border-radius:50%;
  background:#008cff;
  filter:blur(20px);
  opacity:.35;
}

#previewCanvas,
#characterCanvas{
  width:100%;
  height:100%;
  display:block;
}

/* BUTTONS */

.mainButtons{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:15px;
}

.btn3d{
  width:100%;
  min-height:59px;
  border-radius:18px;
  color:#fff;
  font-weight:1000;
  letter-spacing:2px;
  font-size:17px;
  background:linear-gradient(145deg,#ff3158,#b90030);
  border:1px solid #ff5874;
  box-shadow:
    inset 0 2px rgba(255,255,255,.18),
    0 7px 0 #620019,
    0 0 22px rgba(255,23,68,.2);
}

.btn3d.blue{
  background:linear-gradient(145deg,#18a0ff,#005ba9);
  border-color:#50baff;
  box-shadow:
    inset 0 2px rgba(255,255,255,.18),
    0 7px 0 #00386a;
}

.btn3d.dark{
  background:linear-gradient(145deg,#17273b,#060a11);
  border-color:#3d5772;
  box-shadow:
    inset 0 2px rgba(255,255,255,.1),
    0 7px 0 #020305;
}

.btn3d:active{
  transform:translateY(6px);
  box-shadow:0 1px 0 #020305;
}

.menuGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.smallBtn{
  min-height:53px;
  border-radius:16px;
  color:#dcecff;
  background:linear-gradient(145deg,#13253b,#050912);
  border:1px solid #294967;
  box-shadow:0 5px 0 #020306;
  font-weight:900;
}

.smallBtn:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #020306;
}

/* ================= GAME ================= */

#game{
  position:absolute;
  inset:0;
  display:none;
  overflow:hidden;
  background:#07101d;
}

#threeCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* HUD */

.hud{
  position:absolute;
  z-index:30;
  top:calc(10px + env(safe-area-inset-top));
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.hudBox{
  min-width:100px;
  padding:8px 11px;
  border-radius:14px;
  background:rgba(4,12,23,.88);
  border:1px solid rgba(0,145,255,.7);
  box-shadow:0 5px 20px rgba(0,0,0,.4);
}

.hudTitle{
  color:#60bdff;
  font-size:9px;
  letter-spacing:2px;
  font-weight:1000;
}

.hudValue{
  margin-top:2px;
  font-size:21px;
  font-weight:1000;
}

.coinText{
  color:#ffd438;
}

#pauseBtn{
  pointer-events:auto;
  width:46px;
  height:46px;
  border-radius:14px;
  color:#fff;
  background:linear-gradient(145deg,#26364c,#070b12);
  border:1px solid #536a84;
  box-shadow:0 6px 0 #020306;
  font-size:19px;
}

/* POWER HUD */

.powerHUD{
  position:absolute;
  z-index:31;
  top:calc(66px + env(safe-area-inset-top));
  right:10px;
  width:165px;
  display:flex;
  flex-direction:column;
  gap:7px;
  pointer-events:none;
}

.power{
  display:none;
  padding:7px 9px;
  border-radius:13px;
  background:rgba(3,9,18,.92);
  border:1px solid #008cff;
}

.power.active{
  display:block;
}

.powerName{
  font-size:10px;
  font-weight:1000;
  letter-spacing:1px;
}

.powerTime{
  font-size:17px;
  font-weight:1000;
  margin-top:2px;
}

.powerBar{
  height:5px;
  margin-top:4px;
  overflow:hidden;
  border-radius:10px;
  background:#02050a;
}

.powerFill{
  width:100%;
  height:100%;
  background:#00aaff;
  transform-origin:left;
}

/* CONTROLS */

.controls{
  position:absolute;
  z-index:35;
  left:0;
  right:0;
  bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-between;
  padding:0 16px;
  pointer-events:none;
}

.controlGroup{
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.control{
  width:61px;
  height:61px;
  border-radius:20px;
  color:#fff;
  background:linear-gradient(145deg,#1a2a40,#050a11);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:
    inset 0 1px rgba(255,255,255,.12),
    0 6px 0 #020306;
  font-size:26px;
}

.control:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 #020306;
}

/* ================= PANELS ================= */

.panel{
  position:absolute;
  inset:0;
  z-index:200;
  display:none;
  overflow-y:auto;
  padding:
    calc(15px + env(safe-area-inset-top))
    14px
    calc(25px + env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 15% 0%,rgba(0,136,255,.17),transparent 32%),
    radial-gradient(circle at 90% 55%,rgba(255,23,68,.12),transparent 30%),
    #03060c;
}

.panel.show{
  display:block;
}

.panelHeader{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:14px;
}

.back{
  width:45px;
  height:45px;
  border-radius:15px;
  color:#fff;
  background:linear-gradient(145deg,#1a2c43,#070b12);
  border:1px solid #405a76;
  box-shadow:0 5px 0 #020306;
  font-size:25px;
}

.panelTitle{
  font-size:25px;
  font-weight:1000;
}

.panelTitle span{
  color:#ff1744;
}

.section{
  margin-bottom:13px;
  padding:14px;
  border-radius:21px;
  background:linear-gradient(145deg,rgba(15,29,48,.96),rgba(3,7,13,.96));
  border:1px solid rgba(0,136,255,.34);
  box-shadow:
    inset 0 1px rgba(255,255,255,.07),
    0 10px 25px rgba(0,0,0,.4);
}

.section h3{
  margin:0 0 10px;
  color:#55b7ff;
  font-size:12px;
  letter-spacing:2px;
}

/* SHOP */

.coinWallet{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  margin-bottom:12px;
  border-radius:15px;
  background:#050a12;
  border:1px solid #273e58;
}

.coinWallet strong{
  color:#ffd438;
  font-size:21px;
}

.shopGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.item{
  padding:9px;
  border-radius:18px;
  text-align:center;
  background:linear-gradient(145deg,#14253b,#060a11);
  border:1px solid #294a68;
  box-shadow:0 5px 0 #020306;
}

.itemPreview{
  height:105px;
  display:grid;
  place-items:center;
  margin-bottom:8px;
  border-radius:14px;
  background:
    radial-gradient(circle,rgba(0,136,255,.2),transparent 65%),
    #07101d;
  font-size:52px;
}

.itemName{
  font-size:13px;
  font-weight:1000;
}

.price{
  margin:6px 0;
  color:#ffd438;
  font-size:12px;
}

.item button,
.powerCard button{
  padding:9px 11px;
  border-radius:11px;
  color:#fff;
  background:linear-gradient(145deg,#119eff,#0059a9);
  font-weight:900;
}

/* POWER */

.powerGrid{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.powerCard{
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px;
  border-radius:20px;
  background:linear-gradient(145deg,#14263e,#050a11);
  border:1px solid #315477;
  box-shadow:0 6px 0 #020306;
}

.powerIcon{
  width:62px;
  height:62px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border-radius:50%;
  font-size:29px;
  background:radial-gradient(circle at 30% 25%,#55c8ff,#0061b8 55%,#031329);
  border:2px solid #008cff;
}

.powerCard.red .powerIcon{
  background:radial-gradient(circle at 30% 25%,#ff6681,#c50032 55%,#28000b);
  border-color:#ff1744;
}

.powerInfo{
  flex:1;
}

.powerInfo h3{
  margin:0;
  font-size:16px;
}

.powerInfo p{
  margin:5px 0 0;
  color:#91a5bd;
  font-size:11px;
}

/* MISSIONS */

.mission{
  padding:13px;
  margin-bottom:9px;
  border-radius:16px;
  background:#07101b;
  border:1px solid #243b55;
}

.missionTop{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:900;
}

.missionProgress{
  height:7px;
  margin-top:9px;
  overflow:hidden;
  border-radius:10px;
  background:#02050a;
}

.missionProgress div{
  width:0;
  height:100%;
  background:linear-gradient(90deg,#008cff,#55c8ff);
}

/* SETTINGS */

.settingRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #17283b;
}

.switch{
  width:52px;
  height:29px;
  padding:3px;
  border-radius:20px;
  background:#1a2a3d;
}

.switch i{
  display:block;
  width:23px;
  height:23px;
  border-radius:50%;
  background:#71859b;
  transition:.2s;
}

.switch.on{
  background:#008cff;
}

.switch.on i{
  transform:translateX(23px);
  background:#fff;
}

/* ================= GAME OVER ================= */

#gameOver,
#pauseOverlay{
  position:absolute;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(7px);
}

#gameOver.show,
#pauseOverlay.show{
  display:flex;
}

.gameOverCard{
  width:100%;
  max-width:390px;
  padding:25px;
  border-radius:27px;
  text-align:center;
  background:
    linear-gradient(145deg,#142238,#04080f);
  border:1px solid #3a5876;
  box-shadow:
    0 20px 50px rgba(0,0,0,.7),
    0 0 35px rgba(0,136,255,.15);
}

.gameOverTitle{
  font-size:32px;
  font-weight:1000;
  color:#ff1744;
}

.finalScore{
  margin-top:13px;
  color:#7ecaff;
  font-size:15px;
}

.finalScore strong{
  display:block;
  margin-top:4px;
  color:#fff;
  font-size:38px;
}

/* TOAST */

#toast{
  position:absolute;
  z-index:500;
  left:50%;
  bottom:95px;
  min-width:180px;
  max-width:90%;
  padding:11px 15px;
  border-radius:14px;
  text-align:center;
  font-size:12px;
  font-weight:900;
  background:linear-gradient(145deg,#15263b,#050a11);
  border:1px solid #008cff;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,15px);
  transition:.2s;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MOBILE */

@media(max-height:700px){
  .characterCard{
    height:190px;
  }

  .logo{
    width:68px;
    height:68px;
    font-size:35px;
  }

  .gameTitle{
    font-size:28px;
  }
}

@media(min-width:700px){
  #menu,
  .panel{
    width:520px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
  }

  .controls{
    max-width:700px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
  }
}
</style>
</head
